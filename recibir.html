<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notificaciones de pastillas</title>
<style>
:root{--bg:#EEF3F4;--card:#fff;--ink:#14303A;--muted:#5C7580;--acc:#1D6FB8;--ok:#2E8B57;--bad:#C23B3B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1B20;--card:#17272E;--ink:#E6F0F2;--muted:#93A9B1;--acc:#5AA9EA;--ok:#4DC184;--bad:#EF6B6B}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:440px;margin:0 auto;padding:36px 20px;text-align:center}
.card{background:var(--card);border-radius:18px;padding:24px 20px}
h1{font-size:1.4rem;margin:0 0 8px}
p{margin:8px 0;color:var(--muted)}
button{font:inherit;font-weight:700;padding:16px;border:0;border-radius:12px;background:var(--acc);color:#fff;width:100%;margin-top:14px;cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#st{font-weight:700;margin-top:16px;color:var(--ink)}
.ok{color:var(--ok)!important}.err{color:var(--bad)!important}
</style>
</head>
<body>
<main>
<div class="card">
<h1>💊 Avisos de tus pastillas</h1>
<p>Toca el botón y acepta el permiso para recibir una notificación a la hora de cada toma, aunque esta página esté cerrada.</p>
<button id="b" disabled>Activar notificaciones</button>
<div id="st" role="status">Cargando...</div>
<p id="det" style="font-size:.75rem;word-break:break-all"></p>
<p id="ios" hidden>En iPhone: toca Compartir, elige “Agregar a pantalla de inicio”, abre la app desde ese ícono y activa las notificaciones desde ahí.</p>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var S=new URLSearchParams(location.search).get("s");
var dir=location.pathname.replace(/[^\/]*$/,"");
function st(t,c){var e=$("st");e.textContent=t;e.className=c||""}
if(/iPhone|iPad/.test(navigator.userAgent))$("ios").hidden=false;

if(!S){st("Falta el enlace de configuración. Pide de nuevo el enlace completo.","err")}
else fetch(S+(S.indexOf("?")>-1?"&":"?")+"accion=publico").then(function(r){return r.json()}).then(function(j){
  if(!j.appId){st("Las notificaciones aún no están activadas por quien configuró los avisos.","err");return}
  iniciar(j.appId);
}).catch(function(){st("No se pudo cargar la configuración. Intenta de nuevo más tarde.","err")});

function iniciar(appId){
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  var sc=document.createElement("script");
  sc.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";sc.defer=true;
  document.head.appendChild(sc);
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.init({appId:appId,serviceWorkerPath:dir.slice(1)+"OneSignalSDKWorker.js",serviceWorkerParam:{scope:dir}});
    var ps=OneSignal.User.PushSubscription;
    function refrescar(){
      if(OneSignal.Notifications.permission&&ps.optedIn&&ps.id){st("✅ Registrado correctamente. Ya puedes cerrar esta página.","ok");$("b").disabled=true}
      else if(OneSignal.Notifications.permission){st("Permiso aceptado, pero el celular aún no quedó registrado. Toca el botón otra vez o espera unos segundos.","err");$("b").disabled=false}
      else if(window.Notification&&Notification.permission==="denied"){st("Las notificaciones están bloqueadas. Actívalas desde los permisos del navegador para este sitio.","err")}
      else{st("Aún no activadas.");$("b").disabled=false}
    }
    try{ps.addEventListener("change",refrescar)}catch(e){}
    var err="";
    async function detalle(){
      var sw="?";
      try{var rs=await navigator.serviceWorker.getRegistrations();sw=rs.length?rs.map(function(r){return r.scope}).join(","):"ninguno"}catch(e){sw="error"}
      $("det").textContent="Detalles: permiso="+OneSignal.Notifications.permission+" · optedIn="+ps.optedIn+" · id="+(ps.id||"vacío")+" · service worker="+sw+(err?" · error="+err:"");
    }
    $("b").onclick=async function(){
      st("Activando...");err="";
      try{await OneSignal.Notifications.requestPermission();await ps.optIn()}catch(e){err=(e&&e.message)||String(e)}
      setTimeout(function(){refrescar();detalle()},4000);
    };
    refrescar();detalle();
  });
}
</script>
</body>
</html>
